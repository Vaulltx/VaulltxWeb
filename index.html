<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaulltx Real Persona - Coherente</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .avatar-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
            background-color: #334155;
        }

        .field-group {
            margin-bottom: 12px;
        }

        .field-label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .field-content {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px 12px;
        }

        .field-value {
            flex: 1;
            font-size: 0.95rem;
            color: var(--text-main);
            word-break: break-all;
        }

        .field-value.bio {
            white-space: pre-line;
            line-height: 1.35;
            font-size: 0.9rem;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .btn-copy {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .btn-copy:hover {
            background-color: var(--card-border);
            color: var(--text-main);
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 18px;
        }

        .btn-generate {
            background: linear-gradient(135deg, var(--primary), #2563eb);
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 1rem;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }

        .btn-generate:hover {
            background: linear-gradient(135deg, var(--primary-hover), #1d4ed8);
        }

        .btn-copy-all {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .btn-copy-all:hover {
            background-color: var(--card-border);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Vaulltx Real Persona</h1>
            <p>Fotos reales, género y edades coordinadas</p>
        </header>

        <main class="card" id="identityCard">
            
            <div class="avatar-container">
                <img id="valAvatar" class="avatar-img" src="" alt="Foto Realista" onerror="handleImageError(this)">
            </div>

            <div class="field-group">
                <span class="field-label">Nombre Completo</span>
                <div class="field-content">
                    <span class="field-value" id="valName">Cargando...</span>
                    <button class="btn-copy" onclick="copyField('valName', this)">📋</button>
                </div>
            </div>

            <div class="field-group">
                <span class="field-label">Usuario Sugerido</span>
                <div class="field-content">
                    <span class="field-value" id="valUsername">Cargando...</span>
                    <button class="btn-copy" onclick="copyField('valUsername', this)">📋</button>
                </div>
            </div>

            <div class="field-group">
                <span class="field-label">Fecha de Nacimiento</span>
                <div class="field-content">
                    <span class="field-value" id="valDob">Cargando...</span>
                    <button class="btn-copy" onclick="copyField('valDob', this)">📋</button>
                </div>
            </div>

            <div class="field-group">
                <span class="field-label">Ubicación</span>
                <div class="field-content">
                    <span class="field-value" id="valLocation">Cargando...</span>
                    <button class="btn-copy" onclick="copyField('valLocation', this)">📋</button>
                </div>
            </div>

            <div class="field-group">
                <span class="field-label">Biografía Realista</span>
                <div class="field-content">
                    <span class="field-value bio" id="valBio">Cargando...</span>
                    <button class="btn-copy" onclick="copyField('valBio', this)">📋</button>
                </div>
            </div>

            <div class="actions">
                <button class="btn-generate" onclick="generateIdentity()">✨ Generar Perfil Realista</button>
                <button class="btn-copy-all" id="btnCopyAll" onclick="copyAll()">📋 Copiar Perfil Completo</button>
            </div>

        </main>
    </div>

    <script>
        const maleNames = ["Carlos", "Alejandro", "Mateo", "Daniel", "Diego", "Javier", "Fernando", "Adrian", "Gabriel", "Lucas", "Santiago", "Rodrigo", "Gonzalo", "Marcos"];
        const femaleNames = ["Sofía", "Valeria", "Camila", "Lucía", "Mariana", "Gabriela", "Natalia", "Elena", "Paula", "Daniela", "Andrea", "Isabel", "Martina", "Victoria"];
        const lastNames = ["García", "Rodríguez", "López", "Martínez", "González", "Pérez", "Sánchez", "Romero", "Torres", "Ruiz", "Hernández", "Díaz", "Vargas", "Castro"];
        
        const cities = ["Madrid, España", "Ciudad de México, México", "Buenos Aires, Argentina", "Bogotá, Colombia", "Santiago, Chile", "Lima, Perú", "Miami, EE. UU.", "Barcelona, España"];
        const months = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        // IDs específicos de Pravatar comprobados que son adultos y corresponden exactamente a su género
        const malePhotoIds = [1, 3, 7, 8, 11, 12, 13, 14, 15, 18, 33, 51, 52, 53, 55, 59, 60, 64, 68];
        const femalePhotoIds = [2, 5, 9, 10, 16, 19, 20, 21, 22, 23, 24, 26, 27, 28, 32, 38, 43, 44, 49];

        const maleBios = [
            "Arquitecto de día, aficionado a la fotografía de noche. 📸\n📍 {city}\nAmante del café negro y los viajes.",
            "Ingeniero de software. 💻\nInteresado en la tecnología, el ciclismo y los deportes al aire libre.\n📍 {city}",
            "Emprendedor y entusiasta del fitness. 🏋️‍♂️\nConstruyendo proyectos. {city}",
            "Diseñador gráfico & Creativo visual.\nExplorando lugares nuevos siempre. ✈️\n📍 {city}"
        ];

        const femaleBios = [
            "Diseñadora UX/UI & Ilustradora independiente. 🎨\nCreando cosas simples y funcionales.\n📍 {city}",
            "Consultora de marketing digital. 📈\nApasionada por la lectura, el yoga y las buenas conversaciones. 🌿\n📍 {city}",
            "Docente & Estudiante permanente. 📚\nCompartiendo un poco de mi día a día.\n📍 {city}",
            "Fotógrafa & Creadora de contenido. 📷\nAmante de los atardeceres y el café.\n📍 {city}"
        ];

        let currentGender = "male";

        function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function sanitizeUsername(str) {
            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
        }

        function handleImageError(imgElement) {
            imgElement.onerror = null;
            // Respaldo exacto por género usando Randomuser si la primera falla
            const genderParam = currentGender === "male" ? "men" : "women";
            const randomId = getRandomInt(1, 70);
            imgElement.src = `https://randomuser.me/api/portraits/${genderParam}/${randomId}.jpg`;
        }

        function generateIdentity() {
            // Seleccionar género de forma totalmente equitativa
            const isMale = Math.random() > 0.5;
            currentGender = isMale ? "male" : "female";

            const firstName = isMale ? getRandomItem(maleNames) : getRandomItem(femaleNames);
            const lastName = getRandomItem(lastNames);
            const fullName = `${firstName} ${lastName}`;
            const city = getRandomItem(cities);

            // Edad fija de adultos jóvenes (21 a 32 años)
            const age = getRandomInt(21, 32);
            const currentYear = new Date().getFullYear();
            const birthYear = currentYear - age;
            const day = getRandomInt(1, 28);
            const month = getRandomItem(months);
            const dob = `${day} de ${month} de ${birthYear} (${age} años)`;

            // Asignar ID de foto filtrado según género para garantizar que sea adulto e imagen correcta
            const photoIdList = isMale ? malePhotoIds : femalePhotoIds;
            const photoId = getRandomItem(photoIdList);
            const photoUrl = `https://i.pravatar.cc/300?img=${photoId}`;

            const cleanFirst = sanitizeUsername(firstName);
            const cleanLast = sanitizeUsername(lastName);
            const username = `${cleanFirst}_${cleanLast}${getRandomInt(10, 99)}`;

            const bioList = isMale ? maleBios : femaleBios;
            let rawBio = getRandomItem(bioList);
            const bio = rawBio.replace("{city}", city);

            const identity = { fullName, photoUrl, username, bio, dob, location: city };
            renderIdentity(identity);
        }

        function renderIdentity(identity) {
            document.getElementById('valAvatar').src = identity.photoUrl;
            document.getElementById('valName').innerText = identity.fullName;
            document.getElementById('valUsername').innerText = identity.username;
            document.getElementById('valBio').innerText = identity.bio;
            document.getElementById('valDob').innerText = identity.dob;
            document.getElementById('valLocation').innerText = identity.location;
        }

        function copyField(elementId, btnElement) {
            const textToCopy = document.getElementById(elementId).innerText;
            if (!textToCopy || textToCopy.includes("Cargando")) return;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btnElement.innerHTML;
                btnElement.innerHTML = "✅";
                setTimeout(() => { btnElement.innerHTML = originalText; }, 1200);
            });
        }

        function copyAll() {
            const name = document.getElementById('valName').innerText;
            const username = document.getElementById('valUsername').innerText;
            const bio = document.getElementById('valBio').innerText;
            const location = document.getElementById('valLocation').innerText;

            if (name.includes("Cargando")) return;

            const fullText = `Nombre: ${name}\nUsuario: ${username}\nUbicación: ${location}\nBiografía:\n${bio}`;

            navigator.clipboard.writeText(fullText).then(() => {
                const btnCopyAll = document.getElementById('btnCopyAll');
                btnCopyAll.innerHTML = "✅ ¡Perfil Copiado!";
                setTimeout(() => { btnCopyAll.innerHTML = "📋 Copiar Perfil Completo"; }, 1500);
            });
        }

        window.onload = generateIdentity;
    </script>
</body>
</html>
