<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaulltx Nature Profiles HD</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --card-border: #30363d;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --input-bg: #0d1117;
            --accent: #2ea043;
            --accent-hover: #3fb950;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .photo-frame {
            width: 100%;
            height: 380px;
            background-color: #010409;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid var(--card-border);
            position: relative;
        }

        .photo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        .field-group {
            margin-bottom: 12px;
        }

        .field-label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .field-content {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px 12px;
        }

        .field-value {
            flex: 1;
            font-size: 0.95rem;
            color: var(--text-main);
            word-break: break-all;
        }

        .field-value.bio {
            white-space: pre-line;
            line-height: 1.4;
            font-size: 0.9rem;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .btn-copy {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .btn-copy:hover {
            background-color: var(--card-border);
            color: var(--text-main);
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 18px;
        }

        .btn-generate {
            background-color: var(--accent);
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 1rem;
        }

        .btn-generate:hover {
            background-color: var(--accent-hover);
        }

        .btn-copy-all {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .btn-copy-all:hover {
            background-color: var(--card-border);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Vaulltx Nature & People</h1>
            <p>Generador dinámico de fotos reales y biografías únicas</p>
        </header>

        <main class="card">
            
            <div class="photo-frame">
                <img id="valAvatar" class="photo-img" src="" alt="Foto en la naturaleza" onerror="handleImageError(this)">
            </div>

            <div class="field-group">
                <span class="field-label">Nombre del Perfil</span>
                <div class="field-content">
                    <span class="field-value" id="valName">Cargando...</span>
                    <button class="btn-copy" onclick="copyField('valName', this)">📋</button>
                </div>
            </div>

            <div class="field-group">
                <span class="field-label">Usuario Instagram</span>
                <div class="field-content">
                    <span class="field-value" id="valUsername">Cargando...</span>
                    <button class="btn-copy" onclick="copyField('valUsername', this)">📋</button>
                </div>
            </div>

            <div class="field-group">
                <span class="field-label">Biografía Dinámica</span>
                <div class="field-content">
                    <span class="field-value bio" id="valBio">Cargando...</span>
                    <button class="btn-copy" onclick="copyField('valBio', this)">📋 Copiar Bio</button>
                </div>
            </div>

            <div class="actions">
                <button class="btn-generate" onclick="generateIdentity()">🌲 Generar Nueva Foto & Bio</button>
                <button class="btn-copy-all" id="btnCopyAll" onclick="copyAll()">📋 Copiar Perfil Completo</button>
            </div>

        </main>
    </div>

    <script>
        // Gran base de datos de nombres y apellidos
        const firstNames = ["Valeria", "Camila", "Sofia", "Elena", "Isabella", "Maya", "Mateo", "Lucas", "Gabriel", "Adrian", "Daniela", "Aarav", "Aaliyah", "Siddharth", "Oliver", "Emma", "Liam", "Mia", "Noah", "Charlotte", "Ethan", "Amara", "Carlos", "Renata", "Joaquín", "Lucía", "Thiago", "Valentina"];
        const lastNames = ["González", "López", "Martínez", "Pérez", "Torres", "Ruiz", "García", "Hernández", "Castro", "Vargas", "Sharma", "Singh", "Patel", "Silva", "Mendoza", "Romero", "Navarro", "Morales"];

        // Generador de descripciones variadas mezclando frases
        const bioIntros = [
            "🌲 Amante del aire libre y los bosques profundos.",
            "🍃 Respirando aire puro entre montañas y árboles.",
            "📸 Capturando la magia de la naturaleza día a día.",
            "🌿 Perdiéndome en senderos verdes para encontrar paz.",
            "🏔️ Explorador/a de paisajes y rincones naturales.",
            "🏕️ Viviendo sin prisa, rodeado/a de pinos y senderos.",
            "✨ Buscando amaneceres y la mejor luz del bosque."
        ];

        const bioDetails = [
            "📍 Rutas de senderismo, fotografía & aventuras.",
            "☕ Café caliente, cámara lista y buena caminata.",
            "🗺️ Viajando ligero y apreciando la vegetación.",
            "🧭 Respeto por la naturaleza y la vida silvestre.",
            "🌱 Desconectando del ruido para reconectar con la tierra.",
            "📷 Enfocando en los pequeños detalles del paisaje."
        ];

        const bioOutros = [
            "💫 Vivir el presente.",
            "🌿 Siempre en movimiento.",
            "🍃 Deja solo huellas.",
            "☀️ Siempre persiguiendo la luz.",
            "🌲 Un día a la vez.",
            "✨ Naturaleza en su estado puro."
        ];

        const userPrefixes = ["wild", "forest", "nature", "green", "outdoor", "hike", "tree", "explore", "wander", "path"];

        function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function generateUniqueBio() {
            return `${getRandomItem(bioIntros)}\n${getRandomItem(bioDetails)}\n${getRandomItem(bioOutros)}`;
        }

        function handleImageError(imgElement) {
            imgElement.onerror = null;
            // Fallback con parámetro único
            imgElement.src = "https://images.unsplash.com/photo-1448375240586-882707db888b?w=600&auto=format&fit=crop&q=80";
        }

        function generateIdentity() {
            const firstName = getRandomItem(firstNames);
            const lastName = getRandomItem(lastNames);
            const fullName = `${firstName} ${lastName}`;
            
            // Nombre de usuario variado
            const prefix = getRandomItem(userPrefixes);
            const cleanName = firstName.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            const username = `${cleanName}_${prefix}${getRandomInt(10, 999)}`;

            // Biografía generada dinámicamente
            const bio = generateUniqueBio();

            // API dinámica: Genera una fotografía REAL diferente cada vez usando semillas aleatorias
            const randomSeed = Math.floor(Math.random() * 100000);
            const photoUrl = `https://picsum.photos/seed/${randomSeed}/600/800`;

            const avatarImg = document.getElementById('valAvatar');
            avatarImg.style.opacity = '0.3';
            avatarImg.src = photoUrl;
            
            avatarImg.onload = function() {
                avatarImg.style.opacity = '1';
            };

            document.getElementById('valName').innerText = fullName;
            document.getElementById('valUsername').innerText = username;
            document.getElementById('valBio').innerText = bio;
        }

        function copyField(elementId, btnElement) {
            const textToCopy = document.getElementById(elementId).innerText;
            if (!textToCopy || textToCopy.includes("Cargando")) return;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btnElement.innerHTML;
                btnElement.innerHTML = "✅";
                setTimeout(() => { btnElement.innerHTML = originalText; }, 1200);
            });
        }

        function copyAll() {
            const name = document.getElementById('valName').innerText;
            const username = document.getElementById('valUsername').innerText;
            const bio = document.getElementById('valBio').innerText;

            if (name.includes("Cargando")) return;

            const fullText = `Nombre: ${name}\nUsuario: ${username}\nBiografía:\n${bio}`;

            navigator.clipboard.writeText(fullText).then(() => {
                const btnCopyAll = document.getElementById('btnCopyAll');
                btnCopyAll.innerHTML = "✅ ¡Perfil Copiado!";
                setTimeout(() => { btnCopyAll.innerHTML = "📋 Copiar Perfil Completo"; }, 1500);
            });
        }

        window.onload = generateIdentity;
    </script>
</body>
</html>
