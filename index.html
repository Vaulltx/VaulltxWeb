<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaulltx Sketch Art</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-border: #333333;
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
            --input-bg: #121212;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .sketch-frame {
            width: 100%;
            height: 380px;
            background-color: #f0efe9;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid #444;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.15);
            position: relative;
        }

        .sketch-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(125%) brightness(95%);
        }

        .field-group {
            margin-bottom: 12px;
        }

        .field-label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .field-content {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px 12px;
        }

        .field-value {
            flex: 1;
            font-size: 0.95rem;
            color: var(--text-main);
            word-break: break-all;
        }

        .field-value.bio {
            white-space: pre-line;
            line-height: 1.35;
            font-size: 0.9rem;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .btn-copy {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .btn-copy:hover {
            background-color: var(--card-border);
            color: var(--text-main);
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 18px;
        }

        .btn-generate {
            background-color: #ffffff;
            color: #000000;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 1rem;
        }

        .btn-generate:hover {
            background-color: #e0e0e0;
        }

        .btn-copy-all {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .btn-copy-all:hover {
            background-color: var(--card-border);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Vaulltx Pencil Sketch</h1>
            <p>Retratos a lápiz y grafito hechos a mano</p>
        </header>

        <main class="card">
            
            <div class="sketch-frame">
                <img id="valAvatar" class="sketch-img" src="" alt="Dibujo a Lápiz" onerror="handleImageError(this)">
            </div>

            <div class="field-group">
                <span class="field-label">Nombre del Personaje</span>
                <div class="field-content">
                    <span class="field-value" id="valName">Cargando...</span>
                    <button class="btn-copy" onclick="copyField('valName', this)">📋</button>
                </div>
            </div>

            <div class="field-group">
                <span class="field-label">Usuario Sugerido</span>
                <div class="field-content">
                    <span class="field-value" id="valUsername">Cargando...</span>
                    <button class="btn-copy" onclick="copyField('valUsername', this)">📋</button>
                </div>
            </div>

            <div class="field-group">
                <span class="field-label">Biografía Artística</span>
                <div class="field-content">
                    <span class="field-value bio" id="valBio">Cargando...</span>
                    <button class="btn-copy" onclick="copyField('valBio', this)">📋 Copiar Bio</button>
                </div>
            </div>

            <div class="actions">
                <button class="btn-generate" onclick="generateIdentity()">✏️ Generar Dibujo a Lápiz</button>
                <button class="btn-copy-all" id="btnCopyAll" onclick="copyAll()">📋 Copiar Perfil Completo</button>
            </div>

        </main>
    </div>

    <script>
        const names = ["Ariana", "Valeria", "Camila", "Sofia", "Elena", "Isabella", "Maya", "Clara", "Lucía", "Abril"];
        const lastNames = ["González", "López", "Martínez", "Pérez", "Torres", "Ruiz", "García", "Hernández", "Castro", "Vargas"];

        const bios = [
            "✍️ Bocetos a lápiz y grafito.\n📍 Arte de retrato en papel.",
            "🎨 Ilustración tradicional & Sketching.\nCapturando expresiones a mano.",
            "✏️ Trazos suaves, sombras y textura de papel.\nCuaderno de dibujo personal."
        ];

        // Lista de semillas garantizadas que cargan siempre sin errores
        const seeds = ["sketch_girl_1", "portrait_pencil_2", "art_drawing_3", "sketch_girl_4", "pencil_art_5", "drawing_girl_6"];

        function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function handleImageError(imgElement) {
            imgElement.onerror = null;
            // Fallback con renderizado SVG inline por si hay problemas de red
            imgElement.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='%23f0efe9'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='6' fill='%23666'>✏️ Dibujo a lápiz</text></svg>";
        }

        function generateIdentity() {
            const firstName = getRandomItem(names);
            const lastName = getRandomItem(lastNames);
            const fullName = `${firstName} ${lastName}`;
            const username = `${firstName.toLowerCase()}_sketch${getRandomInt(10, 99)}`;
            const bio = getRandomItem(bios);

            // Generador dinámico de alta disponibilidad con estilos de líneas finas estilo boceto
            const randomSeed = getRandomItem(seeds) + "_" + Math.floor(Math.random() * 10000);
            const sketchUrl = `https://api.dicebear.com/7.x/open-peeps/svg?seed=${randomSeed}&maskProbability=0&face=smile,cute,awe,serious`;

            document.getElementById('valAvatar').src = sketchUrl;
            document.getElementById('valName').innerText = fullName;
            document.getElementById('valUsername').innerText = username;
            document.getElementById('valBio').innerText = bio;
        }

        function copyField(elementId, btnElement) {
            const textToCopy = document.getElementById(elementId).innerText;
            if (!textToCopy || textToCopy.includes("Cargando")) return;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btnElement.innerHTML;
                btnElement.innerHTML = "✅";
                setTimeout(() => { btnElement.innerHTML = originalText; }, 1200);
            });
        }

        function copyAll() {
            const name = document.getElementById('valName').innerText;
            const username = document.getElementById('valUsername').innerText;
            const bio = document.getElementById('valBio').innerText;

            if (name.includes("Cargando")) return;

            const fullText = `Nombre: ${name}\nUsuario: ${username}\nBiografía:\n${bio}`;

            navigator.clipboard.writeText(fullText).then(() => {
                const btnCopyAll = document.getElementById('btnCopyAll');
                btnCopyAll.innerHTML = "✅ ¡Perfil Copiado!";
                setTimeout(() => { btnCopyAll.innerHTML = "📋 Copiar Perfil Completo"; }, 1500);
            });
        }

        window.onload = generateIdentity;
    </script>
</body>
</html>
